name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git LFS
        run: |
          git lfs install
          git lfs track "data/investor_data.csv"
          git add .gitattributes

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "doyeonlee-log"
          git config --global user.email "github-actions@github.com"
          
          # Git LFS가 적용된 상태에서 허깅페이스로 강제 푸시
          git add data/investor_data.csv
          git commit -m "Sync LFS data to Hugging Face [skip ci]" || echo "No changes to commit"
          
          git push "https://doyeonlee-log:$HF_TOKEN@huggingface.co/spaces/doyeonlee-log/yongstocks.git" main:refs/heads/main --force
