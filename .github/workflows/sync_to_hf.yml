name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "doyeonlee-log"
          git config --global user.email "lehdus2756@gmail.com"
          git remote add hf https://huggingface.co/spaces/doyeonlee-log/yongstocks
          git push hf main:refs/heads/main --force
