name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          pip install hf

      - name: Upload Entire Repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 현재 디렉토리(.)의 모든 파일과 폴더를 허깅페이스 스페이스에 통째로 동기화
          hf upload doyeonlee-log/yongstocks . . --token $HF_TOKEN --repo-type space --commit-message "Sync all code and data from GitHub"
