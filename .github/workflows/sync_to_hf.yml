name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # 매일 데이터가 수집되어서 main 브랜치에 자동 업데이트될 때마다 작동!

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://사용자아이디:$HF_TOKEN@huggingface.co/spaces/doyeonlee-log/yongstocks main --force
